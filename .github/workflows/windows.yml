name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: Fabrication du .exe
        run: python -m PyInstaller --noconfirm gemz_studio.spec
      - uses: actions/upload-artifact@v4
        with:
          name: GemZ-Studio-Windows
          path: dist/GemZ Studio.exe
